<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rise of the Warriors vs Reyes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f111a;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1d28;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #2a2e3f;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    .clan-header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 40%;
    }

    .clan-header.right {
      justify-content: flex-end;
    }

    .clan-logo {
      width: 55px;
      height: 55px;
      object-fit: contain;
      border-radius: 8px;
    }

    .clan-name {
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .rtw-color { color: #3b82f6; }
    .rys-color { color: #ef4444; }

    .vs-title {
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      color: #e2e8f0;
    }

    .admin-btn {
      background-color: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 25px;
      transition: background 0.2s;
    }

    .admin-btn:hover {
      background-color: #475569;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .reta-card {
      background: #181b26;
      border: 1px solid #2a2e3f;
      border-radius: 10px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .player-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 35%;
    }

    .player-box.right {
      justify-content: flex-end;
    }

    .player-name {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .tag-win {
      background: #166534;
      color: #4ade80;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      border: 1px solid #22c55e;
    }

    .tag-lose {
      background: #991b1b;
      color: #fca5a5;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      border: 1px solid #ef4444;
    }

    .score-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .score-text {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: #0f111a;
      padding: 4px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .status-en-curso {
      background-color: #f97316;
      color: #ffffff;
    }

    .status-en-progreso {
      background-color: #2563eb;
      color: #ffffff;
    }

    .status-pendiente {
      background-color: #475569;
      color: #cbd5e1;
    }

    /* Modales */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: #1e2230;
      border: 1px solid #3b82f6;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal h3 {
      margin-bottom: 15px;
      color: #60a5fa;
    }

    .modal input, .modal select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #0f111a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-main {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .admin-item {
      background: #0f111a;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      border: 1px solid #2a2e3f;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="clan-header left">
      <img src="RTW.png" alt="RTW" class="clan-logo" onerror="this.src='https://via.placeholder.com/55?text=RTW'">
      <span class="clan-name rtw-color">Rise of the Warriors</span>
    </div>
    <div class="vs-title">VS</div>
    <div class="clan-header right">
      <span class="clan-name rys-color">Reyes</span>
      <img src="RYS.png" alt="RYS" class="clan-logo" onerror="this.src='https://via.placeholder.com/55?text=RYS'">
    </div>
  </header>

  <button class="admin-btn" onclick="openAuthModal()">Panel de Administración</button>

  <div class="container" id="tournament-container"></div>

  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <h3>Código de Administrador</h3>
      <input type="password" id="admin-pass" placeholder="Ingresa la clave de acceso">
      <div class="modal-actions">
        <button class="btn-main" onclick="checkAuth()">Ingresar</button>
        <button class="btn-danger" onclick="closeModal('auth-modal')">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="admin-panel-modal">
    <div class="modal">
      <h3>Gestión de Torneo</h3>
      
      <div style="margin-bottom: 20px;">
        <h4>Añadir Nueva Reta / Enfrentamiento</h4>
        <input type="text" id="new-rtw-player" placeholder="Jugador RTW (Izquierda)">
        <input type="text" id="new-rys-player" placeholder="Jugador RYS (Derecha)">
        <button class="btn-main" onclick="addMatch()" style="width: 100%;">Añadir Enfrentamiento</button>
      </div>

      <hr style="border-color: #334155; margin-bottom: 20px;">

      <h4>Editar Retas Existentes</h4>
      <div id="admin-matches-list"></div>

      <div class="modal-actions">
        <button class="btn-danger" onclick="closeModal('admin-panel-modal')">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    const PASS = "123456789";
    let matches = JSON.parse(localStorage.getItem('rtw_rys_matches')) || [
      { id: 1, rtwPlayer: "Jugador A1", rysPlayer: "Jugador B1", rtwScore: 0, rysScore: 0, status: "pendiente", winner: "none" }
    ];

    function saveState() {
      localStorage.setItem('rtw_rys_matches', JSON.stringify(matches));
      render();
    }

    function openAuthModal() {
      document.getElementById('admin-pass').value = '';
      document.getElementById('auth-modal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function checkAuth() {
      const input = document.getElementById('admin-pass').value;
      if (input === PASS) {
        closeModal('auth-modal');
        renderAdminPanel();
        document.getElementById('admin-panel-modal').style.display = 'flex';
      } else {
        alert("Código incorrecto");
      }
    }

    function addMatch() {
      const rtwP = document.getElementById('new-rtw-player').value.trim();
      const rysP = document.getElementById('new-rys-player').value.trim();
      if (!rtwP || !rysP) return alert("Ingresa ambos nombres de jugador");

      matches.push({
        id: Date.now(),
        rtwPlayer: rtwP,
        rysPlayer: rysP,
        rtwScore: 0,
        rysScore: 0,
        status: "pendiente",
        winner: "none"
      });

      document.getElementById('new-rtw-player').value = '';
      document.getElementById('new-rys-player').value = '';
      saveState();
      renderAdminPanel();
    }

    function removeMatch(id) {
      matches = matches.filter(m => m.id !== id);
      saveState();
      renderAdminPanel();
    }

    function updateMatch(id, field, value) {
      const match = matches.find(m => m.id === id);
      if (!match) return;

      if (field === 'rtwScore' || field === 'rysScore') {
        let val = parseInt(value, 10);
        if (isNaN(val)) val = 0;
        if (val < 0) val = 0;
        if (val > 999) val = 999;
        match[field] = val;
      } else {
        match[field] = value;
      }
      saveState();
    }

    function renderAdminPanel() {
      const container = document.getElementById('admin-matches-list');
      container.innerHTML = '';

      matches.forEach((m, idx) => {
        const div = document.createElement('div');
        div.className = 'admin-item';
        div.innerHTML = `
          <strong>Set #${idx + 1}: ${m.rtwPlayer} vs ${m.rysPlayer}</strong>
          <div class="grid-2" style="margin-top: 8px;">
            <div>
              <label>Puntos RTW (0-999):</label>
              <input type="number" min="0" max="999" value="${m.rtwScore}" onchange="updateMatch(${m.id}, 'rtwScore', this.value)">
            </div>
            <div>
              <label>Puntos RYS (0-999):</label>
              <input type="number" min="0" max="999" value="${m.rysScore}" onchange="updateMatch(${m.id}, 'rysScore', this.value)">
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label>Estado actual:</label>
              <select onchange="updateMatch(${m.id}, 'status', this.value)">
                <option value="pendiente" ${m.status === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                <option value="en-curso" ${m.status === 'en-curso' ? 'selected' : ''}>En curso (Naranja)</option>
                <option value="en-progreso" ${m.status === 'en-progreso' ? 'selected' : ''}>En progreso (Azul)</option>
              </select>
            </div>
            <div>
              <label>Ganador / Resultado:</label>
              <select onchange="updateMatch(${m.id}, 'winner', this.value)">
                <option value="none" ${m.winner === 'none' ? 'selected' : ''}>Sin definir</option>
                <option value="rtw" ${m.winner === 'rtw' ? 'selected' : ''}>Ganó RTW (RYS Lose)</option>
                <option value="rys" ${m.winner === 'rys' ? 'selected' : ''}>Ganó RYS (RTW Lose)</option>
              </select>
            </div>
          </div>
          <button class="btn-danger" style="margin-top: 5px; width:100%;" onclick="removeMatch(${m.id})">Eliminar Reta</button>
        `;
        container.appendChild(div);
      });
    }

    function render() {
      const container = document.getElementById('tournament-container');
      container.innerHTML = '';

      matches.forEach(m => {
        let rtwTag = '';
        let rysTag = '';

        if (m.winner === 'rtw') {
          rtwTag = `<span class="tag-win">WIN</span>`;
          rysTag = `<span class="tag-lose">LOSE</span>`;
        } else if (m.winner === 'rys') {
          rtwTag = `<span class="tag-lose">LOSE</span>`;
          rysTag = `<span class="tag-win">WIN</span>`;
        }

        let statusBadge = '';
        if (m.status === 'en-curso') {
          statusBadge = `<span class="status-badge status-en-curso">En curso</span>`;
        } else if (m.status === 'en-progreso') {
          statusBadge = `<span class="status-badge status-en-progreso">En progreso</span>`;
        } else {
          statusBadge = `<span class="status-badge status-pendiente">Pendiente</span>`;
        }

        const card = document.createElement('div');
        card.className = 'reta-card';
        card.innerHTML = `
          <div class="player-box left">
            <span class="player-name">${m.rtwPlayer}</span>
            ${rtwTag}
          </div>
          <div class="score-center">
            ${statusBadge}
            <div class="score-text">${m.rtwScore} - ${m.rysScore}</div>
          </div>
          <div class="player-box right">
            ${rysTag}
            <span class="player-name">${m.rysPlayer}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    render();
  </script>
</body>
</html>
