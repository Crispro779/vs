<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rise of the Warriors vs Reyes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f111a;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1d28;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #2a2e3f;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    .clan-header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 40%;
    }

    .clan-header.right {
      justify-content: flex-end;
    }

    .clan-logo {
      width: 55px;
      height: 55px;
      object-fit: contain;
      border-radius: 8px;
    }

    .clan-name {
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .rtw-color { color: #3b82f6; }
    .rys-color { color: #ef4444; }

    .vs-title {
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      color: #e2e8f0;
    }

    .admin-btn {
      background-color: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 25px;
      transition: background 0.2s;
    }

    .admin-btn:hover {
      background-color: #475569;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .reta-card {
      background: #181b26;
      border: 1px solid #2a2e3f;
      border-radius: 10px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .player-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 35%;
    }

    .player-box.right {
      justify-content: flex-end;
    }

    .player-name {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .tag-win {
      background: #166534;
      color: #4ade80;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      border: 1px solid #22c55e;
    }

    .tag-lose {
      background: #991b1b;
      color: #fca5a5;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      border: 1px solid #ef4444;
    }

    .score-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .score-text {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: #0f111a;
      padding: 4px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .status-no-iniciado {
      background-color: #64748b;
      color: #ffffff;
    }

    .status-en-curso {
      background-color: #f97316;
      color: #ffffff;
    }

    .status-finalizado {
      background-color: #10b981;
      color: #ffffff;
    }

    /* Modales */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: #1e2230;
      border: 1px solid #3b82f6;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal h3 {
      margin-bottom: 15px;
      color: #60a5fa;
    }

    .modal input, .modal select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #0f111a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-main {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .admin-item {
      background: #0f111a;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      border: 1px solid #2a2e3f;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="clan-header left">
      <img src="RTW.png" alt="RTW" class="clan-logo" onerror="this.src='https://via.placeholder.com/55?text=RTW'">
      <span class="clan-name rtw-color">Rise of the Warriors</span>
    </div>
    <div class="vs-title">VS</div>
    <div class="clan-header right">
      <span class="clan-name rys-color">Reyes</span>
      <img src="RYS.png" alt="RYS" class="clan-logo" onerror="this.src='https://via.placeholder.com/55?text=RYS'">
    </div>
  </header>

  <button class="admin-btn" onclick="openAuthModal()">Panel de Administración</button>

  <div class="container" id="tournament-container"></div>

  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <h3>Código de Administrador</h3>
      <input type="password" id="admin-pass" placeholder="Ingresa la clave de acceso">
      <div class="modal-actions">
        <button class="btn-main" onclick="checkAuth()">Ingresar</button>
        <button class="btn-danger" onclick="closeModal('auth-modal')">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="admin-panel-modal">
    <div class="modal">
      <h3>Gestión de Torneo</h3>
      
      <div style="margin-bottom: 20px;">
        <h4>Añadir Nueva Reta / Enfrentamiento</h4>
        <input type="text" id="new-rtw-player" placeholder="Jugador RTW (Izquierda)">
        <input type="text" id="new-rys-player" placeholder="Jugador RYS (Derecha)">
        <button class="btn-main" onclick="addMatch()" style="width: 100%;">Añadir Enfrentamiento</button>
      </div>

      <hr style="border-color: #334155; margin-bottom: 20px;">

      <h4>Editar Retas Existentes</h4>
      <div id="admin-matches-list"></div>

      <div class="modal-actions">
        <button class="btn-danger" onclick="closeModal('admin-panel-modal')">Cerrar</button>
      </div>
    </div>
  </div>
